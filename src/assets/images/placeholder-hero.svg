<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Placeholder illustration of an electric delivery scooter">
  <!--
    PLACEHOLDER ASSET — replace with the client's hero photography.
    Drawn as flat vector so it stays crisp at any size and costs ~5KB, not 500KB.
  -->
  <defs>
    <linearGradient id="bwHeroSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#6E2E0E"/>
    </linearGradient>
    <linearGradient id="bwHeroVolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE49A"/>
      <stop offset="100%" stop-color="#FFCC29"/>
    </linearGradient>
    <radialGradient id="bwHeroGlow" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#FFCC29" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFCC29" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bwHeroGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bwHeroSky)"/>
  <rect width="1200" height="900" fill="url(#bwHeroGrid)"/>
  <circle cx="600" cy="470" r="430" fill="url(#bwHeroGlow)"/>

  <!-- Ground -->
  <path d="M60 742H1140" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#FFCC29" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round">
    <path d="M120 792H280"/><path d="M340 792H440"/><path d="M500 792H560"/>
  </g>

  <!-- Scooter, side profile. Solid body so it reads at a glance, bright rims so
       it reads on the dark ground. -->
  <g transform="translate(170 250)">
    <!-- Tyres -->
    <circle cx="180" cy="430" r="112" fill="#0A0A0A" stroke="#33312E" stroke-width="30"/>
    <circle cx="680" cy="430" r="112" fill="#0A0A0A" stroke="#33312E" stroke-width="30"/>
    <!-- Rims -->
    <circle cx="180" cy="430" r="62" fill="none" stroke="url(#bwHeroVolt)" stroke-width="10"/>
    <circle cx="680" cy="430" r="62" fill="none" stroke="url(#bwHeroVolt)" stroke-width="10"/>
    <circle cx="180" cy="430" r="14" fill="#FFE49A"/>
    <circle cx="680" cy="430" r="14" fill="#FFE49A"/>

    <!-- Floorboard + body shell -->
    <path d="M196 404h268l72-118h104l58 118h-96l-58 74H236a42 42 0 0 1-40-74Z" fill="#1F1E1C"/>
    <path d="M196 404h268l72-118h104l58 118" fill="none" stroke="url(#bwHeroVolt)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Seat -->
    <path d="M150 274h236a36 36 0 0 1 0 72H186a36 36 0 0 1-36-36Z" fill="#33312E"/>
    <path d="M150 274h236a36 36 0 0 1 0 72" fill="none" stroke="#FFE49A" stroke-opacity="0.85" stroke-width="6"/>

    <!-- Stem, bar, headlamp -->
    <path d="M680 292V168" stroke="#33312E" stroke-width="22" stroke-linecap="round"/>
    <path d="M618 156h128" stroke="#FFE49A" stroke-width="22" stroke-linecap="round"/>
    <circle cx="756" cy="214" r="30" fill="#FFF4D1"/>
    <path d="M786 214h168l-52 36h-116Z" fill="#FFE49A" opacity="0.24"/>

    <!-- Delivery box -->
    <rect x="76" y="118" width="212" height="146" rx="20" fill="#141414" stroke="#E88B54" stroke-opacity="0.75" stroke-width="7"/>
    <path d="m192 150-40 60h34l-16 46 48-64h-36Z" fill="#FFE49A"/>
  </g>

  <!-- Charge motif -->
  <g transform="translate(880 128)">
    <rect x="0" y="0" width="152" height="78" rx="20" fill="none" stroke="#E88B54" stroke-opacity="0.55" stroke-width="5"/>
    <rect x="152" y="27" width="16" height="24" rx="6" fill="#E88B54" fill-opacity="0.55"/>
    <rect x="16" y="16" width="35" height="46" rx="8" fill="#FFCC29"/>
    <rect x="59" y="16" width="35" height="46" rx="8" fill="#FFCC29" fill-opacity="0.62"/>
    <rect x="102" y="16" width="35" height="46" rx="8" fill="#FFCC29" fill-opacity="0.24"/>
  </g>
</svg>
