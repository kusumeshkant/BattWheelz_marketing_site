<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 480" width="1152" height="480" role="img" aria-label="Illustrated placeholder of the Battwheelz team beside an electric bike">
  <!--
    PLACEHOLDER ASSET — an illustration, not a photograph of anybody.
    Replace with a real team photo cropped to roughly 12:5.
  -->
  <defs>
    <linearGradient id="bwGroupBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="55%" stop-color="#FAFAF9"/>
      <stop offset="100%" stop-color="#F9DCCB"/>
