<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 277 300" width="277" height="300" role="img" aria-label="Illustrated placeholder portrait">
  <!--
    PLACEHOLDER ASSET - an illustrated stand-in, not a photograph of anybody.
    Replace with the real team member's portrait, cropped to 277x300.
    Deliberately faceless: a flat illustration reads as a placeholder, where a
    generated face would read as a real person we are misrepresenting.
  -->
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4D1"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="277" height="300" fill="url(#bg4)"/>
  <circle cx="138" cy="196" r="120" fill="#E88B54" opacity="0.28"/>

  <!-- Shoulders -->
  <path d="M138 214c52 0 94 34 94 86v22H44v-22c0-52 42-86 94-86Z" fill="#C99B0B"/>
  <path d="M112 218h52l-10 34-16 12-16-12-10-34Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M138 300v-40" stroke="#8A6A06" stroke-width="4" stroke-linecap="round"/>

  <!-- Neck + head -->
  <path d="M120 182h36v40a18 18 0 0 1-36 0Z" fill="#C9906A"/>
  <circle cx="138" cy="140" r="56" fill="#C9906A"/>
  <path d="M82 126c0-34 25-60 56-60s57 26 57 60c0 6-1 10-1 10l-12-30-16 8-30-6-24 10-14 24s-16-6-16-16Z" fill="#241A14"/>
</svg>
